[package]
name = "flasharr"
version = "1.0.0"
edition = "2021"
description = "Multi-host download manager with *arr integration"
authors = ["Flasharr Team"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full", "test-util"] }

# Database
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream", "cookies", "multipart", "native-tls-alpn", "gzip", "brotli", "deflate"] }

# WebSocket
tokio-tungstenite = "0.21"
tokio-util = "0.7"
futures-util = "0.3"
socket2 = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
rand = "0.8"
aes-gcm = "0.10"
url = "2"
urlencoding = "2.1"
regex = "1.12.2"
once_cell = "1.21.3"
sha1 = "0.10"
sha2 = "0.10"
libc = "0.2"
moka = { version = "0.12", features = ["future"] }
quick-xml = "0.31"  # For Newznab XML generation
toml = "0.8"        # For config file persistence

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.26.0"
